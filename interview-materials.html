<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考公考编面试真题与案例库</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

    /* ===== Shared tokens (non-color) ===== */
    :root {
      /* Spacing scale */
      --sp-1: 0.25rem;
      --sp-2: 0.5rem;
      --sp-3: 0.75rem;
      --sp-4: 1rem;
      --sp-5: 1.5rem;
      --sp-6: 2rem;
      --sp-7: 3rem;

      /* Radii */
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 999px;

      /* Transitions */
      --t: 0.22s cubic-bezier(.4,.2,.2,1);
      --t-slow: 0.35s cubic-bezier(.2,.7,.2,1);

      /* Theme name for JS detection */
      --theme-name: 'dark';
    }

    /* ===== Dark theme (default) ===== */
    [data-theme="dark"] {
      --bg: #0a0d13;
      --bg2: #10141e;
      --bg3: #161b28;
      --bg4: #1b2230;
      --surface: #1e2638;
      --surface2: #242d42;
      --surface3: #2b3549;
      --ink: #f2efe9;
      --ink2: #c4c0b9;
      --muted: #6e7791;
      --muted2: #4a5268;
      --rule: #232b3b;
      --rule2: #1c2331;
      --rule3: #2d384e;
      --accent: #f5a623;
      --accent-d: #d98e0a;
      --accent-soft: rgba(245,166,35,0.08);
      --accent2: #7bb896;
      --accent2-d: #5a9472;
      --accent2-soft: rgba(123,184,150,0.08);
      --accent3: #d47070;
      --tag-bg: rgba(245,166,35,0.1);
      --tag-text: #f5a623;
      --source-gov: #7bb896;
      --source-media: #7ba4d4;
      --source-other: #b89dd4;
      --shadow-xs: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.25);
      --shadow: 0 4px 20px rgba(0,0,0,0.35);
      --shadow-lg: 0 12px 44px rgba(0,0,0,0.5);
      --shadow-card-hover: 0 4px 16px rgba(0,0,0,0.25);
      --header-bg: var(--bg2);
      --toolbar-bg: var(--bg2);
      --drawer-header-bg: var(--bg3);
      --backdrop: rgba(5,7,10,0.55);
      --answer-bg: var(--bg3);
      --answer-border: var(--rule);
      --answer-section-bg: rgba(245,166,35,0.03);
    }

    /* ===== Light theme (白天) ===== */
    [data-theme="light"] {
      --bg: #f8f9fb;
      --bg2: #ffffff;
      --bg3: #f1f3f6;
      --bg4: #e5e9ef;
      --surface: #ffffff;
      --surface2: #f7f8fa;
      --surface3: #eef0f4;
      --ink: #1f2937;
      --ink2: #4b5563;
      --muted: #6b7280;
      --muted2: #9ca3af;
      --rule: #e5e7eb;
      --rule2: #f0f1f4;
      --rule3: #d1d5db;
      --accent: #d97706;
      --accent-d: #b45309;
      --accent-soft: rgba(217,119,6,0.1);
      --accent2: #059669;
      --accent2-d: #047857;
      --accent2-soft: rgba(5,150,105,0.08);
      --accent3: #dc2626;
      --tag-bg: rgba(217,119,6,0.1);
      --tag-text: #b45309;
      --source-gov: #059669;
      --source-media: #2563eb;
      --source-other: #7c3aed;
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow: 0 4px 20px rgba(0,0,0,0.07);
      --shadow-lg: 0 12px 44px rgba(0,0,0,0.1);
      --shadow-card-hover: 0 4px 16px rgba(0,0,0,0.08);
      --header-bg: var(--bg2);
      --toolbar-bg: var(--bg2);
      --drawer-header-bg: var(--bg3);
      --backdrop: rgba(17,24,39,0.3);
      --answer-bg: var(--surface);
      --answer-border: var(--rule);
      --answer-section-bg: rgba(217,119,6,0.03);
    }

    /* Tag colors for light theme */
    [data-theme="light"] .tag-year {
      background: rgba(5,150,105,0.12);
      color: #047857;
      border-color: rgba(5,150,105,0.2);
    }
    [data-theme="light"] .tag-exam {
      background: rgba(219,39,119,0.1);
      color: #be185d;
      border-color: rgba(219,39,119,0.2);
    }
    [data-theme="light"] .tag-type {
      background: rgba(37,99,235,0.1);
      color: #2563eb;
      border-color: rgba(37,99,235,0.2);
    }
    [data-theme="light"] .tag-source {
      background: rgba(124,58,237,0.1);
      color: #7c3aed;
      border-color: rgba(124,58,237,0.2);
    }

    /* ===== Eye-care theme (护眼) ===== */
    [data-theme="eye"] {
      --bg: #f0f4e8;
      --bg2: #f6f8ee;
      --bg3: #e8eddc;
      --bg4: #dde4cd;
      --surface: #f7f9f0;
      --surface2: #eef2e3;
      --surface3: #e3ead3;
      --ink: #3a4a2f;
      --ink2: #4f5f42;
      --muted: #6e7d5c;
      --muted2: #93a17e;
      --rule: #d4dcc2;
      --rule2: #e5ebd5;
      --rule3: #c5d0ae;
      --accent: #6b8e23;
      --accent-d: #556b2f;
      --accent-soft: rgba(107,142,35,0.12);
      --accent2: #2e8b57;
      --accent2-d: #246b45;
      --accent2-soft: rgba(46,139,87,0.1);
      --accent3: #c0504d;
      --tag-bg: rgba(107,142,35,0.1);
      --tag-text: #556b2f;
      --source-gov: #2e8b57;
      --source-media: #3b6fa5;
      --source-other: #6b5a8c;
      --shadow-xs: 0 1px 2px rgba(58,74,47,0.06);
      --shadow-sm: 0 2px 8px rgba(58,74,47,0.06);
      --shadow: 0 4px 20px rgba(58,74,47,0.08);
      --shadow-lg: 0 12px 44px rgba(58,74,47,0.12);
      --shadow-card-hover: 0 4px 16px rgba(58,74,47,0.1);
      --header-bg: var(--bg2);
      --toolbar-bg: var(--bg2);
      --drawer-header-bg: var(--bg3);
      --backdrop: rgba(58,74,47,0.25);
      --answer-bg: var(--surface);
      --answer-border: var(--rule);
      --answer-section-bg: rgba(107,142,35,0.04);
    }

    /* Tag colors for eye-care theme */
    [data-theme="eye"] .tag-year {
      background: rgba(46,139,87,0.15);
      color: #246b45;
      border-color: rgba(46,139,87,0.25);
    }
    [data-theme="eye"] .tag-exam {
      background: rgba(192,80,77,0.12);
      color: #9c3d3a;
      border-color: rgba(192,80,77,0.22);
    }
    [data-theme="eye"] .tag-type {
      background: rgba(59,111,165,0.12);
      color: #2c5a8a;
      border-color: rgba(59,111,165,0.22);
    }
    [data-theme="eye"] .tag-source {
      background: rgba(107,90,140,0.12);
      color: #5a4778;
      border-color: rgba(107,90,140,0.22);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans SC', -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      transition: background 0.4s ease, color 0.4s ease;
    }
    .app-header, .toolbar, .drawer, .drawer-header, .q-card, .case-card,
    .region-btn, .filter-btn, .search-box input, .view-toggle {
      transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
    }

    /* === App Shell === */
    .app { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; }

    /* === Header === */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.5rem;
      border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
      background: var(--header-bg);
    }
    .app-header .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .app-header .brand-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.1rem; color: var(--bg);
      flex-shrink: 0;
    }
    .app-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    .app-header h1 span { color: var(--accent); }
    .app-header .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .app-header .stats {
      display: flex; gap: 0; font-size: 0.7rem; color: var(--muted);
      align-items: center;
    }
    .app-header .stats span {
      padding: 0 1rem;
      border-right: 1px solid var(--rule);
      white-space: nowrap;
    }
    .app-header .stats span:last-child { border-right: none; padding-right: 0; }
    .app-header .stats span:first-child { padding-left: 0; }
    .app-header .stats strong {
      color: var(--ink);
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      margin-left: 0.3rem;
    }

    /* === Toolbar === */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 0;
      border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
      background: var(--toolbar-bg);
    }

    /* Toolbar section wrapper */
    .toolbar-section {
      padding: 0.6rem 1.5rem;
      border-bottom: 1px solid var(--rule2);
    }
    .toolbar-section:last-child { border-bottom: none; }

    /* Region Selector row */
    .region-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .region-label {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--muted2);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      flex-shrink: 0;
      width: 2.2rem;
    }
    .region-buttons {
      display: flex;
      gap: 0.25rem;
      flex-wrap: wrap;
    }
    .region-btn {
      padding: 0.38rem 0.9rem;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-full);
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--t);
      font-family: inherit;
      white-space: nowrap;
      position: relative;
    }
    .region-btn:hover {
      color: var(--ink2);
      background: var(--surface);
    }
    .region-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      font-weight: 600;
    }

    /* Filter row: search + year + type combined compact layout */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    /* Search box - compact with icon */
    .search-box {
      flex: 0 0 200px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 0.42rem 0.8rem 0.42rem 2.1rem;
      background: var(--bg3);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-size: 0.78rem;
      font-family: inherit;
      outline: none;
      transition: border-color var(--t), box-shadow var(--t), background var(--t);
    }
    .search-box input::placeholder { color: var(--muted2); }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
      background: var(--surface);
    }
    .search-box .search-icon {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted2);
      font-size: 0.75rem;
      pointer-events: none;
    }

    /* Filter group container */
    .filter-group {
      display: flex;
      gap: 0.2rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 0.3rem 0.7rem;
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--t);
      font-family: inherit;
      white-space: nowrap;
    }
    .filter-btn:hover { color: var(--ink2); border-color: var(--rule3); }
    .filter-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }

    /* View toggle - segmented control style */
    .view-toggle {
      display: flex;
      gap: 0.2rem;
      margin-left: auto;
    }
    .view-btn {
      padding: 0.32rem 0.85rem;
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--t);
      font-family: inherit;
    }
    .view-btn:hover { color: var(--ink2); border-color: var(--rule3); }
    .view-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* === Main Content === */
    .main-content {
      flex: 1;
      overflow-y: auto;
    }
    .main-content::-webkit-scrollbar { width: 6px; }
    .main-content::-webkit-scrollbar-track { background: transparent; }
    .main-content::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
    .main-content::-webkit-scrollbar-thumb:hover { background: var(--muted2); }
    .main-inner {
      max-width: 920px;
      margin: 0 auto;
      padding: 0.8rem 1.5rem 3rem;
    }
    .panel-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.4rem 0 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .panel-label .pl-region { color: var(--accent); font-weight: 700; }
    .panel-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule);
    }
    .panel-label .pl-count {
      color: var(--muted);
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
    }

    /* === Question / Case Card === */
    .q-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 0.9rem 1.1rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: border-color var(--t), background var(--t), box-shadow var(--t);
      position: relative;
      box-shadow: var(--shadow-xs);
    }
    .q-card:hover {
      border-color: var(--rule3);
      background: var(--bg3);
      box-shadow: var(--shadow-sm);
    }
    .q-card.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .q-card .q-header {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
    }
    .q-card .q-text {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.6;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .q-card .q-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.65rem;
    }
    .q-card .q-meta {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-top: 0.5rem;
      font-size: 0.7rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .q-card .q-meta .case-count {
      color: var(--accent2);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }
    .q-card .q-meta .case-count::before {
      content: '';
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent2);
    }

    /* === Tags === */
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 0.16rem 0.52rem;
      border-radius: 5px;
      font-size: 0.66rem;
      font-weight: 500;
      white-space: nowrap;
      line-height: 1.5;
    }
    .tag-year {
      background: rgba(123,184,150,0.15);
      color: var(--accent2);
      border: 1px solid rgba(123,184,150,0.25);
    }
    .tag-exam {
      background: rgba(244,114,182,0.12);
      color: #e879a8;
      border: 1px solid rgba(244,114,182,0.22);
    }
    .tag-type {
      background: rgba(96,165,250,0.12);
      color: #6ba4f0;
      border: 1px solid rgba(96,165,250,0.22);
    }
    .tag-source {
      background: rgba(167,139,250,0.12);
      color: #a88be0;
      border: 1px solid rgba(167,139,250,0.22);
    }
    .tag-match {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(245,166,35,0.15);
    }

    /* === Empty State === */
    .empty-state {
      text-align: center;
      padding: 4.5rem 1.5rem;
      color: var(--muted);
    }
    .empty-state .es-icon {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      opacity: 0.35;
    }
    .empty-state p { font-size: 0.88rem; color: var(--ink2); }
    .empty-state .es-hint { font-size: 0.76rem; margin-top: 0.4rem; opacity: 0.7; }

    /* === List End Indicator === */
    .list-end {
      text-align: center;
      font-size: 0.68rem;
      color: var(--muted2);
      padding: 1.5rem 0 0.5rem;
      letter-spacing: 0.1em;
    }

    /* === Theme Toggle === */
    .theme-toggle {
      display: flex;
      gap: 0.2rem;
    }
    .theme-btn {
      width: 32px; height: 32px;
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: 0.95rem;
      cursor: pointer;
      transition: all var(--t);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }
    .theme-btn:hover { color: var(--ink2); border-color: var(--rule3); }
    .theme-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* === Font Size Control === */
    .font-control {
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }
    .font-btn {
      width: 30px; height: 30px;
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      color: var(--muted);
      cursor: pointer;
      transition: all var(--t);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-weight: 700;
      line-height: 1;
    }
    .font-btn:hover { color: var(--ink2); border-color: var(--rule3); }
    .font-btn:active { transform: scale(0.92); }
    .font-btn.minus { font-size: 0.85rem; }
    .font-btn.plus { font-size: 1rem; }
    .font-btn.reset { font-size: 0.65rem; color: var(--muted2); width: auto; padding: 0 0.5rem; font-weight: 600; }
    .font-btn.reset:hover { color: var(--ink2); }

    /* === Answer Template (3 independent collapsible panels) === */
    .ans-panel {
      background: var(--answer-bg);
      border: 1px solid var(--answer-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 0.7rem;
    }
    .ans-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.95rem;
      background: var(--answer-section-bg);
      border-bottom: 1px solid var(--rule2);
      cursor: pointer;
      transition: background var(--t);
    }
    .ans-panel-header:hover { background: var(--accent-soft); }
    .ans-panel.collapsed .ans-panel-header { border-bottom: none; }
    .ans-panel.collapsed .ans-panel-body { display: none; }
    .ans-panel-header .aph-title {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .ans-panel-header .aph-num {
      width: 16px; height: 16px;
      background: var(--accent-soft);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.58rem;
      font-weight: 700;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }
    .ans-panel-header .aph-toggle {
      font-size: 0.7rem;
      color: var(--muted);
      transition: transform var(--t);
    }
    .ans-panel.collapsed .aph-toggle { transform: rotate(-90deg); }
    .ans-panel-body {
      padding: 0;
    }

    /* Panel A: Formal Answer */
    .ans-formal-text {
      padding: 0.9rem 1rem;
      font-size: 0.82rem;
      color: var(--ink);
      line-height: 1.9;
      text-align: justify;
    }

    /* Panel B: Framework steps */
    .answer-step {
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--rule2);
      position: relative;
    }
    .answer-step:last-child { border-bottom: none; }
    .answer-step .as-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }
    .answer-step .as-num {
      width: 20px; height: 20px;
      background: var(--accent-soft);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.64rem;
      font-weight: 600;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }
    .answer-step .as-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink);
    }
    .answer-step .as-hint {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      background: var(--accent2-soft);
      border: 1px dashed var(--accent2);
      border-radius: 5px;
      font-size: 0.68rem;
      color: var(--accent2);
      margin-left: 1.65rem;
    }
    .answer-step .as-details {
      list-style: none;
      margin: 0.4rem 0 0 1.65rem;
      padding: 0;
    }
    .answer-step .as-details li {
      position: relative;
      padding: 0.15rem 0 0.15rem 1rem;
      font-size: 0.74rem;
      color: var(--ink2);
      line-height: 1.6;
    }
    .answer-step .as-details li::before {
      content: '';
      position: absolute;
      left: 0.2rem;
      top: 0.6rem;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.5;
    }
    .answer-step.has-case .as-num {
      background: var(--accent2-soft);
      color: var(--accent2);
    }
    .answer-step .as-case-ref {
      margin-top: 0.45rem;
      margin-left: 1.65rem;
      padding: 0.5rem 0.7rem;
      background: var(--accent2-soft);
      border-left: 2px solid var(--accent2);
      border-radius: 0 5px 5px 0;
      font-size: 0.75rem;
      color: var(--ink2);
      display: none;
    }
    .answer-step .as-case-ref.show { display: block; }
    .answer-step .as-case-ref .acr-label {
      font-size: 0.66rem;
      font-weight: 700;
      color: var(--accent2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.2rem;
      display: block;
    }

    /* Panel C: Case Sources + Linked Cases */
    .ans-sources { padding: 0; }
    .ans-source-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--rule2);
    }
    .ans-source-item:last-child { border-bottom: none; }
    .ans-source-item .asi-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink);
      flex-shrink: 0;
    }
    .ans-source-item .asi-link {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.7rem;
      color: var(--accent2);
      text-decoration: none;
      transition: color var(--t);
    }
    .ans-source-item .asi-link:hover { color: var(--accent); }
    /* Linked cases inside Panel C */
    .ans-cases-divider {
      padding: 0.5rem 1rem 0.3rem;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--rule2);
    }
    .ans-cases-list {
      padding: 0.6rem 0.8rem;
    }
    .ans-cases-list .case-card {
      margin-bottom: 0.6rem;
    }
    .ans-cases-list .case-card:last-child { margin-bottom: 0; }

    /* === Date Tag with hover tooltip (year only, hover for full date) === */
    .tag-date {
      background: rgba(168,162,158,0.08);
      color: var(--muted);
      border: 1px solid var(--rule3);
      position: relative;
      cursor: help;
    }
    .tag-year { position: relative; cursor: help; }
    /* Tooltip styles - apply to any tag containing .td-full */
    .tag .td-full,
    .tag-year .td-full {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: var(--surface3);
      color: var(--ink);
      border: 1px solid var(--rule3);
      border-radius: var(--radius-sm);
      padding: 0.25rem 0.6rem;
      font-size: 0.68rem;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--t), transform var(--t);
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .tag .td-full::after,
    .tag-year .td-full::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 4px solid transparent;
      border-top-color: var(--surface3);
    }
    .tag:hover .td-full,
    .tag-year:hover .td-full,
    .tag-date:hover .td-full {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* === Detail Drawer === */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: var(--backdrop);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--t-slow);
      z-index: 40;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed;
      top: 0; right: 0;
      width: 520px;
      max-width: 100vw;
      height: 100vh;
      background: var(--bg2);
      border-left: 1px solid var(--rule);
      box-shadow: -8px 0 32px rgba(0,0,0,0.4);
      transform: translateX(105%);
      transition: transform var(--t-slow);
      z-index: 50;
      display: flex;
      flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.3rem;
      border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
      background: var(--drawer-header-bg);
    }
    .drawer-title {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--ink);
    }
    .drawer-title .dt-region { color: var(--accent); margin-right: 0.4rem; }
    .drawer-close {
      width: 34px; height: 34px;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--t);
      font-family: inherit;
    }
    .drawer-close:hover { color: var(--ink); border-color: var(--accent); background: var(--surface2); }
    .drawer-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 1.3rem;
    }
    .drawer-scroll::-webkit-scrollbar { width: 5px; }
    .drawer-scroll::-webkit-scrollbar-track { background: transparent; }
    .drawer-scroll::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
    .drawer-scroll::-webkit-scrollbar-thumb:hover { background: var(--muted2); }

    /* === Detail Content === */
    .detail-question {
      font-size: 1.08rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.65;
      margin-bottom: 0.7rem;
      letter-spacing: -0.01em;
    }
    .detail-exam {
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 0.9rem;
    }
    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.3rem;
      border-bottom: 1px solid var(--rule2);
    }

    .cases-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cases-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule);
    }

    /* === Case Card === */
    .case-card {
      background: var(--bg3);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 1rem 1.1rem;
      margin-bottom: 0.7rem;
      transition: border-color var(--t), box-shadow var(--t);
      position: relative;
      box-shadow: var(--shadow-xs);
    }
    .case-card:hover {
      border-color: var(--rule3);
      box-shadow: var(--shadow-sm);
    }
    .case-card .case-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }
    .case-card .case-card-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--ink);
      flex: 1;
    }
    .case-year-inline {
      flex-shrink: 0;
    }
    .case-card .case-body {
      font-size: 0.88rem;
      font-weight: 400;
      color: var(--ink2);
      line-height: 1.8;
      margin-bottom: 0.85rem;
    }
    .case-card .case-data-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.7rem;
    }
    .case-data-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
      padding: 0.2rem 0.58rem;
      background: var(--accent-soft);
      border: 1px solid rgba(245,166,35,0.08);
      border-radius: 6px;
      font-size: 0.72rem;
    }
    .case-data-chip .cdv {
      font-weight: 700;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
    }
    .case-data-chip .cdl { color: var(--muted); }
    .case-card .case-quote {
      padding: 0.6rem 0.85rem;
      background: var(--bg2);
      border-left: 2px solid var(--accent2);
      border-radius: 0 4px 4px 0;
      font-size: 0.8rem;
      color: var(--ink2);
      line-height: 1.7;
      margin-bottom: 0.7rem;
    }
    .case-card .case-quote .cq-author {
      display: block;
      color: var(--muted);
      font-size: 0.7rem;
      margin-top: 0.4rem;
      font-style: normal;
    }
    .case-card .case-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.7rem;
      color: var(--muted);
      padding-top: 0.65rem;
      border-top: 1px solid var(--rule2);
      flex-wrap: wrap;
    }
    .case-card .case-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink);
      flex-shrink: 0;
    }
    .case-card .case-source-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.32rem;
      flex-wrap: wrap;
    }
    .case-card .case-source-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .case-card .case-source-link {
      color: var(--accent2);
      text-decoration: none;
      transition: color var(--t);
      font-weight: 500;
    }
    .case-card .case-source-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }
    .dot-gov { background: var(--source-gov); color: var(--source-gov); }
    .dot-media { background: var(--source-media); color: var(--source-media); }
    .dot-other { background: var(--source-other); color: var(--source-other); }

    /* Linked Q badge in case view */
    .linked-q-ref {
      display: block;
      padding: 0.65rem 0.9rem;
      background: var(--bg3);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      color: var(--ink2);
      cursor: pointer;
      transition: all var(--t);
      margin-bottom: 0.45rem;
      line-height: 1.55;
    }
    .linked-q-ref:hover {
      background: var(--accent-soft);
      border-color: rgba(245,166,35,0.25);
      color: var(--ink);
    }

    /* === Animations === */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(14px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes drawerFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .drawer-scroll > * {
      animation: drawerFadeIn 0.25s ease both;
    }

    .q-card {
      animation: fadeIn 0.18s ease both;
    }

    /* === Responsive === */
    @media (max-width: 768px) {
      html { font-size: 14px; }
      .app-header { padding: 0.75rem 1rem; }
      .app-header h1 { font-size: 1rem; }
      .app-header .header-right { gap: 0.6rem; }
      .app-header .stats { gap: 0; font-size: 0.66rem; }
      .app-header .stats span { padding: 0 0.6rem; }
      .app-header .stats strong { font-size: 0.8rem; }
      .app-header .brand-icon { width: 32px; height: 32px; font-size: 1rem; }
      .theme-btn { width: 28px; height: 28px; font-size: 0.8rem; }
      .font-btn { width: 26px; height: 26px; }
      .font-btn.minus { font-size: 0.75rem; }
      .font-btn.plus { font-size: 0.9rem; }
      .font-btn.reset { font-size: 0.58rem; padding: 0 0.35rem; }
      .toolbar { padding: 0; gap: 0; }
      .toolbar-section { padding: 0.5rem 1rem; }
      .main-inner { padding: 0.6rem 1rem 2rem; }
      .drawer { width: 100%; }
      .drawer-scroll { padding: 1rem; }
      .q-card { padding: 0.85rem 1rem; }
      .case-card { padding: 0.95rem 1rem; }
      .detail-question { font-size: 0.98rem; }
      .filter-bar { gap: 0.4rem; }
      .search-box { flex: 1 1 100%; }
      .filter-group { flex: 1 1 auto; }
      .region-btn { padding: 0.38rem 0.8rem; font-size: 0.74rem; }
      .answer-step { padding: 0.7rem 0.85rem; }
      .answer-step .as-content { padding-left: 0; font-size: 0.78rem; }
      .answer-step .as-hint { margin-left: 0; }
      .answer-step .as-details { margin-left: 0; }
      .answer-step .as-case-ref { margin-left: 0; }
    }

    @media (max-width: 480px) {
      .app-header .stats span:nth-child(3) { display: none; }
      .panel-label { font-size: 0.6rem; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">考</div>
        <h1><span>考公考编</span>面试真题与案例库</h1>
      </div>
      <div class="header-right">
        <div class="stats">
          <span>真题 <strong id="stat-q">0</strong></span>
          <span>案例 <strong id="stat-c">0</strong></span>
          <span>覆盖 <strong id="stat-y">0</strong> 年</span>
        </div>
        <div class="font-control" id="fontControl">
          <button class="font-btn minus" id="fontMinus" title="缩小字体">A-</button>
          <button class="font-btn reset" id="fontReset" title="恢复默认">标准</button>
          <button class="font-btn plus" id="fontPlus" title="放大字体">A+</button>
        </div>
        <div class="theme-toggle" id="themeToggle">
          <button class="theme-btn" data-theme="light" title="白天模式">&#x2600;</button>
          <button class="theme-btn" data-theme="eye" title="护眼模式">&#x1F33F;</button>
          <button class="theme-btn active" data-theme="dark" title="暗黑模式">&#x1F319;</button>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <!-- Region Selector -->
      <div class="toolbar-section">
        <div class="region-bar">
          <span class="region-label">地区</span>
          <div class="region-buttons" id="regionButtons"></div>
        </div>
      </div>

      <!-- Search + Filters + View toggle -->
      <div class="toolbar-section">
        <div class="filter-bar">
          <div class="search-box">
            <span class="search-icon">&#x1F50D;</span>
            <input type="text" id="searchInput" placeholder="搜索关键词、题型、来源...">
          </div>
          <div class="filter-group" id="yearFilters"></div>
          <div class="filter-group" id="typeFilters"></div>
          <div class="view-toggle">
            <button class="view-btn active" data-view="questions">真题</button>
            <button class="view-btn" data-view="cases">案例</button>
          </div>
        </div>
      </div>
    </div>

    <main class="main-content">
      <div class="main-inner">
        <div class="panel-label" id="panelLabel">真题列表</div>
        <div id="mainScroll"></div>
      </div>
    </main>
  </div>

  <!-- Detail Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="detailDrawer" aria-hidden="true">
    <div class="drawer-header">
      <span class="drawer-title" id="drawerTitle">详情</span>
      <button class="drawer-close" id="drawerClose" aria-label="关闭">&times;</button>
    </div>
    <div class="drawer-scroll" id="drawerScroll"></div>
  </aside>

  <script>
  (function() {
    // ===================== THEME SYSTEM =====================
    var THEME_KEY = 'interview-theme';
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelectorAll('.theme-btn').forEach(function(b) {
        b.classList.toggle('active', b.getAttribute('data-theme') === theme);
      });
    }
    function initTheme() {
      var saved = localStorage.getItem(THEME_KEY) || 'dark';
      applyTheme(saved);
    }
    document.getElementById('themeToggle').addEventListener('click', function(e) {
      var b = e.target.closest('.theme-btn');
      if (!b) return;
      var theme = b.getAttribute('data-theme');
      applyTheme(theme);
      localStorage.setItem(THEME_KEY, theme);
    });
    initTheme();

    // ===================== FONT SIZE SYSTEM =====================
    var FONT_KEY = 'interview-fontsize';
    var FONT_MIN = 13;
    var FONT_MAX = 20;
    var FONT_DEFAULT = 15;
    function applyFontSize(size) {
      size = Math.max(FONT_MIN, Math.min(FONT_MAX, size));
      document.documentElement.style.fontSize = size + 'px';
      var resetBtn = document.getElementById('fontReset');
      if (resetBtn) resetBtn.textContent = (size === FONT_DEFAULT) ? '标准' : size + 'px';
    }
    function initFontSize() {
      var saved = parseInt(localStorage.getItem(FONT_KEY)) || FONT_DEFAULT;
      applyFontSize(saved);
    }
    document.getElementById('fontPlus').addEventListener('click', function() {
      var cur = parseInt(localStorage.getItem(FONT_KEY)) || FONT_DEFAULT;
      var next = Math.min(FONT_MAX, cur + 1);
      applyFontSize(next);
      localStorage.setItem(FONT_KEY, next);
    });
    document.getElementById('fontMinus').addEventListener('click', function() {
      var cur = parseInt(localStorage.getItem(FONT_KEY)) || FONT_DEFAULT;
      var next = Math.max(FONT_MIN, cur - 1);
      applyFontSize(next);
      localStorage.setItem(FONT_KEY, next);
    });
    document.getElementById('fontReset').addEventListener('click', function() {
      applyFontSize(FONT_DEFAULT);
      localStorage.setItem(FONT_KEY, FONT_DEFAULT);
    });
    initFontSize();

    // ===================== ANSWER SYSTEM =====================
    // Framework templates (structural skeleton with detailed hints and bullet points)
    var answerFrameworks = {
      '综合分析': [
        { title: '破题表态', hint: '一句话概括本质 + 表明态度', 
          details: [
            '用"各位考官"开场，简明扼要概括题目核心议题',
            '表明基本立场：积极支持/辩证看待/高度关注',
            '引出下文分析方向，如"我认为应从以下几个维度来理解"'
          ] },
        { title: '分析阐述', hint: '从意义、现状、原因多角度展开',
          details: [
            '谈意义：这件事对国家治理、民生福祉、社会公平的积极意义',
            '谈现状：当前工作中取得的成绩与存在的不足',
            '谈原因：从制度层面、执行层面、思想层面深挖根源',
            '运用辩证思维，既不一味否定也不盲目乐观'
          ] },
        { title: '案例论证', hint: '结合关联案例的具体做法与数据论证', caseSlot: true,
          details: [
            '引入本地案例："以新疆/石河子的实践为例..."',
            '概述案例做法：谁做了什么，采取了哪些具体措施',
            '引用关键数据：用数据说话增强说服力',
            '点评案例价值：该做法的启示和可推广性'
          ] },
        { title: '对策建议', hint: '提出针对性、可操作的对策',
          details: [
            '制度层面：完善法规政策，建立长效机制',
            '执行层面：强化监督检查，确保落地见效',
            '宣传层面：加强宣传引导，营造良好氛围',
            '技术层面：借助信息化手段，提升工作效率',
            '每条对策力求具体可操作，避免空泛口号'
          ] },

          {

            caseIds: []
          },
          {
            id: 'xj_22', num: 22,
            text: "你是刚进单位的一个新人，领导安排你去农村调研工作，但你没有调研经历，也对乡村不太熟悉，你也有畏难情绪。同时老王想去调研。此时，你怎么办？",
            year: 2025, date: "2025-05-15",
            exam: "新疆公务员面试",
            type: "人际关系", typeCategory: "人际关系", source: "考生回忆",
            caseIds: []
          }
        ],
        cases: []
      }
    };

    var regionOrder = ['shz', 'wlmq', 'kashgar', 'ili', 'aksu', 'changji', 'xj'];

    // ===================== STATE =====================
    var state = {
      region: 'shz',
      search: '',
      yearFilter: 'all',
      typeFilter: 'all',
      view: 'questions',
      selectedQId: null
    };

    // ===================== HELPERS =====================
    function curRegion() { return regions[state.region]; }
    function curQuestions() { return curRegion().questions; }
    function curCases() { return curRegion().cases; }
    function findQuestion(id) {
      return curQuestions().find(function(q) { return q.id === id; });
    }
    function findCase(id) {
      return curCases().find(function(c) { return c.id === id; });
    }
    function getCasesForQuestion(q) {
      return q.caseIds.map(function(id) { return findCase(id); }).filter(Boolean);
    }
    function getQuestionsForCase(c) {
      return curQuestions().filter(function(q) { return q.caseIds.indexOf(c.id) !== -1; });
    }
    function getYears() {
      var s = {};
      curQuestions().forEach(function(q) { s[q.year] = true; });
      curCases().forEach(function(c) { s[c.year] = true; });
      return Object.keys(s).sort(function(a, b) { return b - a; });
    }
    function getTypes() {
      var s = {};
      curQuestions().forEach(function(q) { s[q.typeCategory] = true; });
      return Object.keys(s);
    }
    function sourceLabel(st) {
      if (st === 'gov') return '政府官网';
      if (st === 'media') return '官方媒体';
      return '其他';
    }
    function sourceDotClass(st) {
      if (st === 'gov') return 'dot-gov';
      if (st === 'media') return 'dot-media';
      return 'dot-other';
    }
    function esc(str) {
      var d = document.createElement('div');
      d.textContent = str == null ? '' : String(str);
      return d.innerHTML;
    }

    // ===================== RENDER: Region Buttons =====================
    function renderRegionButtons() {
      var rc = document.getElementById('regionButtons');
      rc.innerHTML = '';
      regionOrder.forEach(function(key) {
        var r = regions[key];
        var b = document.createElement('button');
        b.className = 'region-btn' + (key === state.region ? ' active' : '');
        b.setAttribute('data-region', key);
        b.textContent = r.name;
        rc.appendChild(b);
      });
    }

    // ===================== RENDER: Filters =====================
    function renderFilters() {
      var years = getYears();
      var yc = document.getElementById('yearFilters');
      yc.innerHTML = '<button class="filter-btn active" data-year="all">全部年份</button>';
      years.forEach(function(y) {
        var b = document.createElement('button');
        b.className = 'filter-btn';
        b.setAttribute('data-year', y);
        b.textContent = y + '年';
        yc.appendChild(b);
      });

      var types = getTypes();
      var tc = document.getElementById('typeFilters');
      tc.innerHTML = '<button class="filter-btn active" data-type="all">全部题型</button>';
      types.forEach(function(t) {
        var b = document.createElement('button');
        b.className = 'filter-btn';
        b.setAttribute('data-type', t);
        b.textContent = t;
        tc.appendChild(b);
      });
    }

    // ===================== RENDER: Stats =====================
    function updateStats() {
      document.getElementById('stat-q').textContent = curQuestions().length;
      document.getElementById('stat-c').textContent = curCases().length;
      document.getElementById('stat-y').textContent = getYears().length;
    }

    // ===================== RENDER: List (Questions) =====================
    function renderQuestionList() {
      var container = document.getElementById('mainScroll');
      var filtered = curQuestions().filter(function(q) {
        if (state.yearFilter !== 'all' && q.year !== parseInt(state.yearFilter)) return false;
        if (state.typeFilter !== 'all' && q.typeCategory !== state.typeFilter) return false;
        if (state.search) {
          var s = state.search.toLowerCase();
          if ((q.text + ' ' + q.exam + ' ' + q.type + ' ' + q.source).toLowerCase().indexOf(s) === -1) return false;
        }
        return true;
      });
      if (filtered.length === 0) {
        var pc = document.getElementById('panelCount');
        if (pc) pc.textContent = '';
        container.innerHTML = '<div class="empty-state"><div class="es-icon">\uD83D\uDD0E</div><p>没有匹配的真题</p><p class="es-hint">试试调整筛选条件或搜索关键词</p></div>';
        return;
      }
      var pc = document.getElementById('panelCount');
      if (pc) pc.textContent = '\u00b7 ' + filtered.length + ' \u9898';
      var h = '';
      filtered.forEach(function(q) {
        var lc = getCasesForQuestion(q);
        var sel = state.selectedQId === q.id ? ' selected' : '';
        h += '<div class="q-card' + sel + '" data-qid="' + esc(q.id) + '">';
        h += '  <div class="q-header"><span class="q-text">' + esc(q.text) + '</span></div>';
        h += '  <div class="q-meta"><span>' + esc(q.exam) + '</span><span class="case-count">' + lc.length + ' 个关联案例</span></div>';
        h += '  <div class="q-tags">';
        h += '    <span class="tag tag-year"' + (q.date ? '>' + q.year + '年<span class="td-full">\uD83D\uDCC5 ' + esc(q.date) + '</span>' : '>' + q.year + '年') + '</span>';
        h += '    <span class="tag tag-type">' + esc(q.type) + '</span>';
        h += '    <span class="tag tag-source">' + esc(q.source) + '</span>';
        lc.forEach(function(c) { h += '<span class="tag tag-match">' + esc(c.title) + '</span>'; });
        h += '  </div>';
        h += '</div>';
      });
      h += '<div class="list-end">\u5DF2\u5C55\u793A\u5168\u90E8</div>';
      container.innerHTML = h;
      container.querySelectorAll('.q-card').forEach(function(card) {
        card.addEventListener('click', function() {
          selectQuestion(this.getAttribute('data-qid'));
        });
      });
    }

    // ===================== RENDER: List (Cases) =====================
    function renderCaseList() {
      var container = document.getElementById('mainScroll');
      if (curCases().length === 0) {
        var pc0 = document.getElementById('panelCount');
        if (pc0) pc0.textContent = '';
        container.innerHTML = '<div class="empty-state"><div class="es-icon">\uD83D\uDCC2</div><p>该地区暂无案例素材</p><p class="es-hint">案例正在整理中，敬请期待</p></div>';
        return;
      }
      var filtered = curCases().filter(function(c) {
        if (state.yearFilter !== 'all' && c.year !== parseInt(state.yearFilter)) return false;
        if (state.search) {
          var s = state.search.toLowerCase();
          if ((c.title + ' ' + c.summary + ' ' + c.source).toLowerCase().indexOf(s) === -1) return false;
        }
        return true;
      });
      if (filtered.length === 0) {
        var pc1 = document.getElementById('panelCount');
        if (pc1) pc1.textContent = '';
        container.innerHTML = '<div class="empty-state"><div class="es-icon">\uD83D\uDD0E</div><p>没有匹配的案例</p><p class="es-hint">试试调整搜索关键词</p></div>';
        return;
      }
      var pc2 = document.getElementById('panelCount');
      if (pc2) pc2.textContent = '\u00b7 ' + filtered.length + ' \u4e2a';
      var h = '';
      filtered.forEach(function(c) {
        var lq = getQuestionsForCase(c);
        h += '<div class="q-card" data-cid="' + esc(c.id) + '">';
        var yearTagHtml = c.sourceDate
          ? '<span class="tag tag-date case-year-inline">' + c.year + '年<span class="td-full">\uD83D\uDCC5 ' + esc(c.sourceDate) + '</span></span>'
          : '<span class="tag tag-year case-year-inline">' + c.year + '年</span>';
        h += '  <div class="q-header"><span class="q-num">C' + c.num + '</span><span class="q-text">' + esc(c.title) + '</span>' + yearTagHtml + '</div>';
        h += '  <div class="q-meta"><span>' + (c.sourceUrl ? '<a href="' + esc(c.sourceUrl) + '" target="_blank" rel="noopener" style="color:var(--accent2);text-decoration:none;">' + sourceLabel(c.sourceType) + ' · ' + esc(c.source) + '</a>' : sourceLabel(c.sourceType) + ' · ' + esc(c.source)) + '</span><span class="case-count">' + lq.length + ' 道关联真题</span></div>';
        h += '  <div class="q-tags">';
        if (c.data && c.data.length > 0) {
          c.data.slice(0, 3).forEach(function(d) {
            h += '<span class="tag tag-match">' + esc(d.value) + ' ' + esc(d.label) + '</span>';
          });
        }
        h += '  </div></div>';
      });
      h += '<div class="list-end">\u5DF2\u5C55\u793A\u5168\u90E8</div>';
      container.innerHTML = h;
      container.querySelectorAll('.q-card[data-cid]').forEach(function(card) {
        card.addEventListener('click', function(e) {
          if (e.target.closest('a')) return;
          showCaseDetail(this.getAttribute('data-cid'));
        });
      });
    }

    // ===================== RENDER: Case Card (shared) =====================
    function renderCaseCard(c) {
      var h = '<div class="case-card">';
      // Title row with year tag inline
      h += '  <div class="case-title-row">';
      h += '    <span class="case-card-title">' + esc(c.title) + '</span>';
      if (c.sourceDate) {
        h += '    <span class="tag tag-date case-year-inline">' + c.year + '年<span class="td-full">\uD83D\uDCC5 ' + esc(c.sourceDate) + '</span></span>';
      } else {
        h += '    <span class="tag tag-year case-year-inline">' + c.year + '年</span>';
      }
      h += '  </div>';
      h += '  <div class="case-body">' + esc(c.summary) + '</div>';
      if (c.data && c.data.length > 0) {
        h += '  <div class="case-data-row">';
        c.data.forEach(function(d) {
          h += '<span class="case-data-chip"><span class="cdv">' + esc(d.value) + '</span><span class="cdl">' + esc(d.label) + '</span></span>';
        });
        h += '  </div>';
      }
      if (c.quote) {
        h += '  <div class="case-quote">\u201c' + esc(c.quote) + '\u201d<span class="cq-author">\u2014\u2014 ' + esc(c.quoteAuthor || '') + '</span></div>';
      }
      h += '  <div class="case-footer">';
      var sourceText = sourceLabel(c.sourceType) + ' \u00b7 ' + esc(c.source);
      if (c.sourceUrl) {
        h += '    <span class="case-source-badge"><span class="case-source-dot ' + sourceDotClass(c.sourceType) + '"></span><a class="case-source-link" href="' + esc(c.sourceUrl) + '" target="_blank" rel="noopener">' + sourceText + '</a></span>';
      } else {
        h += '    <span class="case-source-badge"><span class="case-source-dot ' + sourceDotClass(c.sourceType) + '"></span>' + sourceText + '</span>';
      }
      h += '  </div>';
      h += '</div>';
      return h;
    }

    // ===================== RENDER: Question Detail (drawer) =====================
    function renderQuestionDetail(q) {
      var linkedCases = getCasesForQuestion(q);
      var h = '';
      h += '<div class="detail-question">' + esc(q.text) + '</div>';
      h += '<div class="detail-exam">' + esc(q.exam) + '</div>';
      h += '<div class="detail-tags">';
      h += '  <span class="tag tag-year"' + (q.date ? '>' + q.year + '年<span class="td-full">\uD83D\uDCC5 ' + esc(q.date) + '</span>' : '>' + q.year + '年') + '</span>';
      h += '  <span class="tag tag-type">' + esc(q.type) + '</span>';
      h += '  <span class="tag tag-source">' + esc(q.source) + '</span>';
      h += '</div>';
      // Answer template (now includes linked cases in Panel C)
      var answerHtml = renderAnswerTemplate(q, linkedCases);
      if (answerHtml) {
        h += answerHtml;
      }
      document.getElementById('drawerScroll').innerHTML = h;
      document.getElementById('drawerTitle').innerHTML =
        '<span class="dt-region">' + esc(curRegion().name) + '</span>\u771F\u9898\u8BE6\u60C5';

      // Bind independent panel toggles
      var panelHeaders = document.querySelectorAll('.ans-panel-header');
      panelHeaders.forEach(function(header) {
        header.addEventListener('click', function() {
          var panel = this.parentElement;
          if (panel) panel.classList.toggle('collapsed');
        });
      });
    }

    // ===================== RENDER: Case Detail (drawer) =====================
    function renderCaseDetail(c) {
      var linkedQs = getQuestionsForCase(c);
      var h = '';
      h += '<div class="case-card" style="border-color:var(--accent2);">';
      // Title row with year tag inline
      h += '  <div class="case-title-row">';
      h += '    <span class="case-card-title">' + esc(c.title) + '</span>';
      if (c.sourceDate) {
        h += '    <span class="tag tag-date case-year-inline">' + c.year + '年<span class="td-full">\uD83D\uDCC5 ' + esc(c.sourceDate) + '</span></span>';
      } else {
        h += '    <span class="tag tag-year case-year-inline">' + c.year + '年</span>';
      }
      h += '  </div>';
      h += '  <div class="case-body">' + esc(c.summary) + '</div>';
      if (c.data && c.data.length > 0) {
        h += '  <div class="case-data-row">';
        c.data.forEach(function(d) {
          h += '<span class="case-data-chip"><span class="cdv">' + esc(d.value) + '</span><span class="cdl">' + esc(d.label) + '</span></span>';
        });
        h += '  </div>';
      }
      if (c.quote) {
        h += '  <div class="case-quote">\u201c' + esc(c.quote) + '\u201d<span class="cq-author">\u2014\u2014 ' + esc(c.quoteAuthor || '') + '</span></div>';
      }
      h += '  <div class="case-footer">';
      var sourceText = sourceLabel(c.sourceType) + ' \u00b7 ' + esc(c.source);
      if (c.sourceUrl) {
        h += '    <span class="case-source-badge"><span class="case-source-dot ' + sourceDotClass(c.sourceType) + '"></span><a class="case-source-link" href="' + esc(c.sourceUrl) + '" target="_blank" rel="noopener">' + sourceText + '</a></span>';
      } else {
        h += '    <span class="case-source-badge"><span class="case-source-dot ' + sourceDotClass(c.sourceType) + '"></span>' + sourceText + '</span>';
      }
      h += '  </div>';
      h += '</div>';

      if (linkedQs.length > 0) {
        h += '<div class="cases-section-title">关联真题（' + linkedQs.length + '）</div>';
        linkedQs.forEach(function(q) {
          h += '<div class="linked-q-ref" data-goto-qid="' + esc(q.id) + '">' + esc(q.text.substring(0, 60)) + (q.text.length > 60 ? '...' : '') + '</div>';
        });
      }
      document.getElementById('drawerScroll').innerHTML = h;
      document.getElementById('drawerTitle').innerHTML =
        '<span class="dt-region">' + esc(curRegion().name) + '</span>案例详情 \u00b7 C' + c.num;

      // bind linked question navigation
      document.getElementById('drawerScroll').querySelectorAll('.linked-q-ref').forEach(function(el) {
        el.addEventListener('click', function() {
          gotoQuestion(this.getAttribute('data-goto-qid'));
        });
      });
    }

    // ===================== ACTIONS =====================
    function selectQuestion(qid) {
      state.selectedQId = qid;
      var q = findQuestion(qid);
      if (!q) return;
      document.querySelectorAll('#mainScroll .q-card').forEach(function(c) {
        c.classList.toggle('selected', c.getAttribute('data-qid') === qid);
      });
      renderQuestionDetail(q);
      openDrawer();
    }

    function showCaseDetail(cid) {
      var c = findCase(cid);
      if (!c) return;
      renderCaseDetail(c);
      openDrawer();
    }

    function gotoQuestion(qid) {
      if (state.view !== 'questions') {
        state.view = 'questions';
        syncViewButtons();
      }
      renderAll();
      selectQuestion(qid);
    }

    function openDrawer() {
      document.getElementById('detailDrawer').classList.add('open');
      document.getElementById('detailDrawer').setAttribute('aria-hidden', 'false');
      document.getElementById('drawerBackdrop').classList.add('open');
      document.getElementById('drawerScroll').scrollTop = 0;
    }

    function closeDrawer() {
      document.getElementById('detailDrawer').classList.remove('open');
      document.getElementById('detailDrawer').setAttribute('aria-hidden', 'true');
      document.getElementById('drawerBackdrop').classList.remove('open');
      state.selectedQId = null;
      document.querySelectorAll('#mainScroll .q-card').forEach(function(c) {
        c.classList.remove('selected');
      });
    }

    function syncViewButtons() {
      document.querySelectorAll('.view-btn').forEach(function(b) {
        b.classList.toggle('active', b.getAttribute('data-view') === state.view);
      });
    }

    function switchRegion(key) {
      if (!regions[key] || key === state.region) {
        // still allow re-select to reset filters
      }
      state.region = key;
      state.search = '';
      state.yearFilter = 'all';
      state.typeFilter = 'all';
      state.selectedQId = null;
      document.getElementById('searchInput').value = '';
      closeDrawer();
      renderRegionButtons();
      renderFilters();
      updateStats();
      renderAll();
    }

    // ===================== MAIN RENDER =====================
    function renderAll() {
      var r = curRegion();
      document.getElementById('panelLabel').innerHTML =
        '<span class="pl-region">' + esc(r.name) + '</span>' +
        (state.view === 'questions' ? '真题列表' : '案例列表') +
        '<span class="pl-count" id="panelCount"></span>';
      if (state.view === 'questions') {
        renderQuestionList();
      } else {
        renderCaseList();
      }
    }

    // ===================== EVENTS =====================
    document.getElementById('searchInput').addEventListener('input', function() {
      state.search = this.value.trim();
      renderAll();
    });

    document.getElementById('yearFilters').addEventListener('click', function(e) {
      var b = e.target.closest('.filter-btn');
      if (!b) return;
      this.querySelectorAll('.filter-btn').forEach(function(x) { x.classList.remove('active'); });
      b.classList.add('active');
      state.yearFilter = b.getAttribute('data-year');
      state.selectedQId = null;
      renderAll();
    });

    document.getElementById('typeFilters').addEventListener('click', function(e) {
      var b = e.target.closest('.filter-btn');
      if (!b) return;
      this.querySelectorAll('.filter-btn').forEach(function(x) { x.classList.remove('active'); });
      b.classList.add('active');
      state.typeFilter = b.getAttribute('data-type');
      state.selectedQId = null;
      renderAll();
    });

    document.querySelectorAll('.view-btn').forEach(function(b) {
      b.addEventListener('click', function() {
        document.querySelectorAll('.view-btn').forEach(function(x) { x.classList.remove('active'); });
        this.classList.add('active');
        state.view = this.getAttribute('data-view');
        state.selectedQId = null;
        renderAll();
      });
    });

    document.getElementById('regionButtons').addEventListener('click', function(e) {
      var b = e.target.closest('.region-btn');
      if (!b) return;
      switchRegion(b.getAttribute('data-region'));
    });

    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeDrawer();
    });

    // ===================== INIT =====================
    renderRegionButtons();
    renderFilters();
    updateStats();
    renderAll();
  })();
  </script>
